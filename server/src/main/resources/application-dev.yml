# Local development. Connection details default to the docker-compose database;
# the password must come from the environment or server/.env.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/code76}
    username: ${DB_USERNAME:code76}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
